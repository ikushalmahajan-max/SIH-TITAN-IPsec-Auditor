name: TITAN IPsec Automated CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f sih/requirements.txt ]; then pip install -r sih/requirements.txt; fi

    - name: Run TITAN Test Suite
      run: |
        python sih/test_runner.py
